<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav {
            position: fixed;
            top: 0;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 1.5rem;
            background-color: white;
            width: 100%;
        }
        
        .home {
            display: flex;
            align-items: center;
            column-gap: .5rem;
        }

        img {
            object-fit: contain;
            width: 40px;
            height: 40px;
        }

        .home p {
            display : none;
        }

        .menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            column-gap: .5rem;
            width: 100%;
        }
        button {
            padding: .5rem 1rem;
            border: none;
            background-color: white;
            font-weight: 500;
            font-size: 10px;
            color: black;
            cursor: pointer;
        }
        .menu a {
            text-decoration: none;
            color: #000;
        }

        @media (min-width: 768px) {            
            .menu {
                display: flex;
                justify-content: flex-end;
                column-gap: .5rem;
                width: 100%;
            }
            .home p {
                display : block;
                font-weight: 600;
                color: black;
                margin: 0;
            }
            button {
            padding: .5rem 1rem;
            border: none;
            background-color: white;
            font-size: .875rem;
            line-height: 1.25rem;
            color: black;
            cursor: pointer;
        }
        }
    </style>
</head>
<body>
    <nav>
        <div class="home">
            <img src="Week1_SMUMC.png" alt="logo">
            <p>SMUMC</p>
        </div>
        <div class="menu">
            <button><a href="PROJECTS.html">PROJECTS</a></button>
            <button><a href="MEMBERS.html">MEMBERS</a></button>
            <button><a href="NOTICE.html">NOTICE</a></button>
            <button><a href="MODE.html">MODE</a></button>
        </div>
    </nav>
</body>
</html>
