<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            color : white;
            display: grid;
            grid-template-areas:
                "HEADER MENU MENU MENU"
                "HERO HERO HERO HERO"
                "HERO HERO HERO HERO"
                "HERO HERO HERO HERO"
                "HERO HERO HERO HERO"
                "MAIN MAIN . IMAGE"
                "MAIN MAIN . IMAGE"
                "MAIN MAIN . EXTRA"
                "MAIN MAIN . EXTRA";
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(9, 70px);
        }
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            color : white;
            line-height: 70px;
            background-color: aqua;
        }
        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column : 2 / 5;
            color : white;
            text-align: center;
            background-color: lightcoral;
        }
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            color : white;
            text-align: center;
            grid-area: HERO;
            background-color: blue;
        }
        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            color : white;
            text-align: center;
            grid-area: MAIN;
            background-color: blueviolet;
        }
        .image {
            display: flex;
            justify-content: center;
            align-items: center;
            color : white;
            text-align: center;
            grid-area: IMAGE;
            background-color: brown;
        }
        .extra {
            display: flex;
            justify-content: center;
            align-items: center;
            color : white;
            text-align: center;
            grid-area: EXTRA;
            background-color: cadetblue;
        }
        .banner {
            display: flex;
            justify-content: center;
            align-items: center;
            color : white;
            width: 100%;
            height: 100px;
            grid-area: BANNER;
            background-color: burlywood;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">HEADER</div>
        <div class="menu">MENU</div>
        <div class="hero">HERO</div>
        <div class="main">MAIN</div>
        <div class="image">IMAGE</div>
        <div class="extra">EXTRA</div>
    </div>
    <div>
        <div class="banner">BANNER</div>
    </div>
</body>
</html>
